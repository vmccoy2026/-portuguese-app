    <script>
        // --- ЛОГИКА СТАРТОВОГО ЭКРАНА ---
        function startLearning() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'block';
        }

        // --- НАВИГАЦИЯ ---
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('map-screen').style.display = 'block';
            document.getElementById('result').innerHTML = '';
            document.getElementById('result-build').innerHTML = '';
        }

        function openAudioLesson() {
            openScreen('audio-lesson');
            document.getElementById('result').innerHTML = '';
        }

        // --- ЛОГИКА АУДИРОВАНИЯ ---
        function playSound(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAudio(selectedWord) {
            const resultDiv = document.getElementById('result');
            if (selectedWord === 'Amigo') {
                resultDiv.innerHTML = '✅ <span style="color: green;">Muito bem! (Отлично!)</span>';
            } else {
                resultDiv.innerHTML = `
                    ❌ <span style="color: red;">Неправильно.</span><br>
                    <span style="font-size: 16px; color: #333;">
                        Правильный ответ: <strong>Amigo (Друг)</strong>.<br>
                        <em>Помни: в португальском слово "amigo" означает "друг".</em>
                    </span>
                `;
            }
        }

        // --- ЛОГИКА СБОРКИ СЛОВ (УРОК 2) ---
        function openBuildLesson() {
            openScreen('build-lesson');
            document.getElementById('sentence-area').innerHTML = '';
            const bank = document.getElementById('word-bank');
            bank.innerHTML = `
                <div class="word-chip" onclick="addWord('Eu', this)">Eu</div>
                <div class="word-chip" onclick="addWord('sou', this)">sou</div>
                <div class="word-chip" onclick="addWord('estudante', this)">estudante</div>
                <div class="word-chip" onclick="addWord('você', this)">você</div>
            `;
            document.getElementById('result-build').innerHTML = '';
        }

        function addWord(word, element) {
            const sentenceArea = document.getElementById('sentence-area');
            const newChip = document.createElement('div');
            newChip.className = 'word-chip';
            newChip.innerText = word;
            newChip.onclick = function() {
                this.remove();
                element.style.display = 'inline-block';
            };
            sentenceArea.appendChild(newChip);
            element.style.display = 'none';
        }

        function checkBuild() {
            const sentenceArea = document.getElementById('sentence-area');
            const words = Array.from(sentenceArea.children).map(chip => chip.innerText);
            const resultDiv = document.getElementById('result-build');
            const correctSentence = "Eu sou estudante";

            if (words.join(' ') === correctSentence) {
                resultDiv.innerHTML = '✅ <span style="color: green;">Отлично! Фраза собрана верно.</span>';
            } else {
                resultDiv.innerHTML = '❌ <span style="color: red;">Пока неверно. Попробуй еще раз!</span>';
            }
        }
    </script>
</body>
</html>
